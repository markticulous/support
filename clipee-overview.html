<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipee overview video</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="description" content="A short video tour of Clipee, a free, private clipboard manager for Windows.">
<style>
  /* Same Windows Fluent look as the Support Markticulous page (index.html): light and dark follow the system. */
  :root {
    --bg: #f3f3f3; --stroke: rgba(0, 0, 0, .07); --text: #1a1a1a; --text2: #5c5c5c; --accent: #0067c0;
    --plate-line: #cfcbc2; --plate-ink: #7a7871;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 12px rgba(0, 0, 0, .05);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --stroke: rgba(255, 255, 255, .08); --text: #ffffff; --text2: #c8c8c8; --accent: #60cdff;
      --plate-line: #4a4842; --plate-ink: #a5a299;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 16px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 15px/1.6 var(--font); background: var(--bg); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .wrap { width: min(1280px, 100% - 32px); margin-inline: auto; }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 18px; }
  .bar img { width: 32px; height: 32px; border-radius: 6px; display: block; }
  .bar a { color: var(--text); font: 600 15px/1 var(--font-display); }
  .back { display: inline-block; margin-top: 8px; font-size: 14px; }
  .back + h1 { margin-top: 12px; }
  h1 { font: 600 clamp(1.8rem, 5vw, 2.5rem)/1.15 var(--font-display); letter-spacing: -.02em; margin: 24px 0 8px; }
  p { color: var(--text2); margin: 0 0 20px; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--stroke); }
  .links { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0 0; }
  footer { display: flex; align-items: center; gap: 12px; padding-block: 36px; color: var(--text2); font-size: 13px; }
  .plate { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; border: 1px solid var(--plate-line); border-radius: 1px 6px 1px 6px; padding: 4.25px 6px 2.25px 6.75px; font: 500 9.5px/1 "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--plate-ink); }
  .plate .dim { opacity: .6; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <img src="assets/markticulous.jpg" alt="" width="32" height="32">
    <a href="./">Support Markticulous</a>
  </header>
  <main>
    <a class="back" href="./#apps">&larr; Back to Markticulous apps</a>
    <h1>Clipee overview</h1>
    <p>A short overview of Clipee, the free and private clipboard manager for Windows. The captions are part of the video.</p>
    <video controls preload="metadata" playsinline poster="assets/clipee-overview-poster.jpg">
      <source src="assets/clipee-overview.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="assets/clipee-overview.mp4">Download it instead.</a>
    </video>
    <div class="links">
      <a href="https://github.com/markticulous/Clipee/releases/latest" rel="noopener">Download Clipee</a>
      <a href="https://github.com/markticulous/Clipee/releases" rel="noopener">Release notes</a>
    </div>
  </main>
  <footer>
    <span class="plate" aria-label="A Markticulous Build"><span class="dim">A</span><span>MARKTICULOUS</span><span class="dim">BUILD</span></span>
    <span>&copy; <span data-year>2026</span> Markticulous</span>
  </footer>
</div>
<script>document.querySelectorAll("[data-year]").forEach(function (e) { e.textContent = new Date().getFullYear(); });</script>
</body>
</html>
