<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Removee logo (two-r box, E2, chosen by Mark 2026-11-26): a box made of two r glyphs, one upright on the left and one on its back along the bottom, its top right corner dissolving into dots. 32 px and up.
       Upright r: stem x15 from y41.5 to y27, arch r8 to (23,19), arm to x28. Lying r: stem y47 from x20.5 to x35, arch r8 to (43,39), arm up to y34. Stroke 6.2. Glyph and dots scaled 1.2 and set one unit right of centre. -->
  <defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
  <path d="M7,4 H48 A12,12 0 0 1 60,16 V57 A3,3 0 0 1 57,60 H16 A12,12 0 0 1 4,48 V7 A3,3 0 0 1 7,4 Z" fill="url(#tile)"/>
  <g transform="translate(33 32) scale(1.2) translate(-31.5 -30.8)">
    <g fill="none" stroke="#fff" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15,41.5 V27 A8,8 0 0 1 23,19 H28"/><path d="M20.5,47 H35 A8,8 0 0 0 43,39 V34"/></g>
    <g fill="#fff"><circle cx="35.4" cy="19" r="2.8"/><circle cx="43" cy="26.6" r="2.8"/><circle cx="42" cy="17" r="2.2"/><circle cx="49" cy="22" r="1.7"/><circle cx="48" cy="13" r="1.3"/></g>
  </g>
