<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Clipee logo (S1): elongated paperclip lying flat, open end right, Markticulous standard tile (Midnight to Cyan). Left curves widened and glyph made taller 2026-10-14, nudged 0.5 down for optical centring. Previous 45° version: clipee-e9-45deg.svg -->
