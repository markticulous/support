    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)"/>
  <path d="M54 19.5 H24 A14 12.5 0 0 0 24 44.5 H48 A3 3 0 0 0 48 38.5 H24 A8 6.5 0 0 1 24 25.5 H42"
